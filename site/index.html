<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ignition Roadshow 2026</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    img {
      display: block;
      width: 100%;
      max-width: 720px;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #f2f2f2; }
    }
  </style>
</head>
<body>
  <h1>Ignition Roadshow 2026</h1>
  <img src="assets/monkey.jpg" alt="A monkey">
</body>
</html>
